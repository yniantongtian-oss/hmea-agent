[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hmea-agent"
version = "0.1.0"
description = "A reproducible sandbox for adaptive update multipliers in tabular Q-learning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HMEA contributors" }]
keywords = [
  "reinforcement-learning",
  "q-learning",
  "temporal-difference-learning",
  "adaptive-learning-rate",
  "reproducible-research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/yniantongtian-oss/hmea-agent"
Repository = "https://github.com/yniantongtian-oss/hmea-agent"
Issues = "https://github.com/yniantongtian-oss/hmea-agent/issues"
Changelog = "https://github.com/yniantongtian-oss/hmea-agent/blob/main/CHANGELOG.md"

[project.scripts]
hmea-compare = "hmea.cli:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16",
]
dev = [
  "build>=1.2",
  "matplotlib>=3.7",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16",
  "twine>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hmea = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["hmea"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
force-exclude = true

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]
