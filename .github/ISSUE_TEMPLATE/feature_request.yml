name: Feature proposal
description: Propose a focused extension or improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or use case should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the API, behavior, or experiment you suggest.
    validations:
      required: true
  - type: textarea
    id: user
    attributes:
      label: Intended user and workflow
      description: Who benefits, and what do they do before and after this change?
    validations:
      required: true
  - type: textarea
    id: demand
    attributes:
      label: Demand evidence
      description: Link related issues, discussions, projects, papers, or repeated workflows if available.
  - type: textarea
    id: evidence
    attributes:
      label: Evaluation plan
      description: How should the change be tested or measured?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I understand that this repository currently targets tabular experiments.
          required: true
