name: CI

on:
  push:
    branches: [main, upgrade/reliability-20261011]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Test with coverage
        run: python -m pytest --cov=hmea --cov-report=term-missing

  package:
    name: Package and smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Test the built wheel
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/python -c "import hmea; assert hmea.__version__ == '0.2.0'"
          wheel-smoke/bin/python -m hmea --steps 500 --seeds 4 --format json
          wheel-smoke/bin/hmea-compare --steps 500 --seeds 4 --compare-to baseline --format json --output paired-smoke.json
          wheel-smoke/bin/python -c "import json; p = json.load(open('paired-smoke.json')); assert p['schema_version'] == 2; assert len(p['paired_comparisons']) == 6; assert all(r['n_pairs'] == 4 for r in p['paired_comparisons'])"
          wheel-smoke/bin/hmea-spec "baseline, 10 steps, 1 seed" > spec-smoke.json
          wheel-smoke/bin/python -c "import json; spec = json.load(open('spec-smoke.json')); assert spec['parse_source'] == 'deterministic'; assert spec['spec']['policies'] == ['baseline']; assert spec['spec']['steps'] == 10"
          wheel-smoke/bin/hmea-tools list-policies > tools-smoke.json
          wheel-smoke/bin/python -c "import json; ids = {item['id'] for item in json.load(open('tools-smoke.json'))['policies']}; assert {'baseline', 'clipped', 'leaky-state'} <= ids"

      - name: Run experiment smoke test
        run: |
          python -m pip install -e ".[plot]"
          python experiments/reproduce_bias_comparison.py --quick
