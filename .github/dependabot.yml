version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "11:30"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
